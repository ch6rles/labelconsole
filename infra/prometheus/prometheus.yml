# Scrape config for Label Console. One target is enough: the web app's
# /api/metrics reads queue, worker, outbox and module state from Redis and
# Postgres, so it covers every worker process.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: labelconsole
    metrics_path: /api/metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/labelconsole-metrics-token # same value as METRICS_TOKEN
    static_configs:
      - targets: ['console.example.com'] # your APP_URL host
